<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blockbound</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="start-screen">
      <div class="eyebrow">BLOCKBOUND</div>
      <h1>Build. Leap. Explore.</h1>
      <p>Place platforms, reach the portal, and make the level your own.</p>
      <button id="play-button">Start Game</button>
    </div>

    <div id="hud">
      <div id="topbar">
        <div id="level-name">A World of Blocks</div>
        <div id="block-count">Blocks: 0</div>
      </div>
      <div id="hotbar"></div>
      <div id="instructions">
        A/D or ←/→ — Move · Space/W/↑ — Jump<br />
        Left click — Mine · Right click — Place · 1–4 — Select block · R — Reset
      </div>
    </div>

    <div id="message" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
